<section class="final-cta">
  <div class="container final-cta-inner">
    <div>
      <span class="eyebrow eyebrow-light">{{ etiqueta() }}</span>
      <h2>{{ titulo() }}</h2>
      <p>{{ texto() }}</p>
    </div>

    <button
      class="button button-orange"
      type="button"
      (click)="presupuesto.abrir(servicio(), 'cta_final')"
    >
      Crear mi solicitud <span>↗</span>
    </button>
  </div>
</section>
