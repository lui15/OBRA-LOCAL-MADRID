@if (conCabecera()) {
  <div class="prices-heading">
    <div>
      <span class="eyebrow">GUÍA DE PRECIOS</span>
      <h4>¿Cuánto cuesta?</h4>
    </div>
    <small>Orientativos, IVA incluido</small>
  </div>
}

<div class="price-grid" appReveal>
  @for (precio of precios(); track precio.id) {
    <div class="price-card">
      <span class="price-size">{{ precio.trabajo }}</span>
      <strong>{{ texto(precio) }}</strong>
      @if (precio.plazo) {
        <small>Plazo: {{ precio.plazo }}</small>
      }
      @if (precio.detalle) {
        <span>{{ precio.detalle }}</span>
      }
    </div>
  }
</div>

<p class="price-disclaimer">{{ nota }}</p>
